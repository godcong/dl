version: "2"
run:
  go: 1.18.10
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - gocritic
    - goheader
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - ioutil.ReadFile
        - io.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - fmt.Read
        - fmt.Write
        - fmt.Close
        - fmt.Exec
    funlen:
      lines: 140
      statements: 140
    goheader:
      template: Copyright (c) 2024 GodCong. All rights reserved.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goheader
        path: _test\.go
      - linters:
          - dupl
          - funlen
          - gocritic
          - gosec
        path: _test\.go
      - linters:
          - unused
        source: ent.Schema
    paths:
      - _default\.go
      - example
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
